# UrbanTwin CI — three jobs over independent components (contract §11):
#   backend : Java 17 + Maven (mvn -B verify, includes unit tests + jar)
#   frontend: Node 20 + tsc/vite production build
#   ml      : Python 3.12 (kernel training smoke + full pytest)
# Each component only builds when its own paths changed.
name: urbantwin-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            ml:
              - 'ml-service/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend (mvn verify)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: urbantwin-api
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: frontend (npm build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  ml:
    name: ml (pytest)
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Train models (sklearn path)
        working-directory: ml-service
        run: python train.py

      - name: Run tests (sklearn backend active)
        working-directory: ml-service
        run: pytest -q
