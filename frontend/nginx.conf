# UrbanTwin web nginx config (contract §10)
# Serves the Vite SPA and reverse-proxies API + ML so the frontend code can
# always use relative paths in production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache for fingerprinted files
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path gets index.html (client-side router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API: vite dev proxy uses /api -> :8080 in dev;
    # here nginx does the same against the compose service name.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/twin/live): disable buffering so events stream immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }

    # WebSocket/SSE upgrade support for /ws (STOMP endpoint)
    location /ws/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Proxy ML service: /ml -> ml:8000
    location /ml/ {
        proxy_pass http://ml:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
