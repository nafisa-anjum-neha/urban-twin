# PostGIS 3.4 on PostgreSQL 16 — geographic spine of the twin (contract §10).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: urbantwin
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
              name: pg
          envFrom:
            - secretRef:
                name: urbantwin-db
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "urbantwin"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "urbantwin"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: urbantwin
spec:
  clusterIP: None # headless — StatefulSet identity
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: pg
