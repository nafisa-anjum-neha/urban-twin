# Spring Boot API — the twin's brain (contract §10).
# Image: built from ./backend (docker build -t urbantwin/api:1.0.0 backend).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: urbantwin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # give Postgres/PostGIS time to come up on a cold cluster
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "for i in $(seq 1 60); do nc -z postgres 5432 && exit 0; sleep 2; done; exit 1"]
      containers:
        - name: api
          image: urbantwin/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: urbantwin-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1.5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: urbantwin
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
