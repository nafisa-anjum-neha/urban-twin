# ML microservice — congestion + waterlogging forecasting (contract §10).
# Image: built from ./ml-service (docker build -t urbantwin/ml:1.0.0 ml-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: urbantwin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
        - name: ml
          image: urbantwin/ml:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /ml/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ml/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: urbantwin
spec:
  selector:
    app: ml
  ports:
    - port: 8000
      targetPort: 8000
